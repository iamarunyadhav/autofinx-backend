; Supervisor config — Quick Trade per-trade stop-loss monitor
; Deploy to /etc/supervisor/conf.d/quick-trade-stop-loss-monitor.conf on your server
; Then: supervisorctl reread && supervisorctl update
;
; MANUAL DEPLOYMENT STEP — this file is not installed/running anywhere.
; This session has no access to the production server; copying this file
; into place and running the two supervisorctl commands above is a step
; the operator must perform themselves.

[program:autofinx-quick-trade-stop-loss-monitor]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan quick-trade:monitor-stop-loss --interval=2
autostart=true
autorestart=true
numprocs=1
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/autofinx-quick-trade-stop-loss-monitor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=30
