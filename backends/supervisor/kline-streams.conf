; Supervisor config — Binance kline stream workers (one per timeframe)
; Deploy to /etc/supervisor/conf.d/kline-streams.conf on your server
; Then: supervisorctl reread && supervisorctl update

[program:autofinx-kline-15m]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan trading:binance-kline-stream
    --timeframe=15m
    --symbols=BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,1000PEPEUSDT
    --reconnect-sleep=5
autostart=true
autorestart=true
numprocs=1
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/autofinx-kline-15m.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=30

[program:autofinx-kline-1h]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan trading:binance-kline-stream
    --timeframe=1h
    --symbols=BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,1000PEPEUSDT
    --reconnect-sleep=5
autostart=true
autorestart=true
numprocs=1
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/autofinx-kline-1h.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=30

; Optional: 1m feed for robot trade sessions using 1-minute candles
[program:autofinx-kline-1m]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan trading:binance-kline-stream
    --timeframe=1m
    --symbols=BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
    --reconnect-sleep=5
autostart=false
autorestart=true
numprocs=1
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/autofinx-kline-1m.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stopwaitsecs=30
