; AutoFinX collector under Supervisor (production-host style). Runs as a NON-ROOT user.
; Replace @USER@ @BASE@ @ENGINE@ (or use install_service.sh --supervisor which does it), then:
;   sudo cp autofinx-collector.supervisor.conf /etc/supervisor/conf.d/autofinx-collector.conf   (path differs per distro)
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status autofinx-collector
; Clean stop: Supervisor sends SIGTERM; the collector handles it (closes files, writes partial report). stopwaitsecs gives it time.
; Resource limits: "nice -n 19 ionice -c3" prefix; process_priority="idle" in the config also sets nice+19.
; Supervisor has no memory limit: for a hard cap start it under  systemd-run --scope -p MemoryMax=512M  or use the systemd unit.
[program:autofinx-collector]
command=nice -n 19 ionice -c3 @BASE@/venv/bin/python -m collector start
directory=@ENGINE@
environment=AUTOFINX_COLLECTOR_CONFIG="@BASE@/collector.config.json",PYTHONUNBUFFERED="1"
user=@USER@
autostart=true
autorestart=true
startsecs=15
startretries=5
exitcodes=0
stopsignal=TERM
stopwaitsecs=40
stopasgroup=true
killasgroup=true
minfds=4096
stdout_logfile=@BASE@/data/logs/supervisor.out.log
stderr_logfile=@BASE@/data/logs/supervisor.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile_backups=3
