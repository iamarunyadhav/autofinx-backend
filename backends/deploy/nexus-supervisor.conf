; Replace directory, command path and user for your server. Existing cron owns schedule:run.
; Dedicated workers: never append these queues to trading workers.
[program:autofinx-nexus-research]
directory=/var/www/autofinx/backends
command=/usr/bin/php artisan queue:work nexus --queue=agent_research --sleep=3 --tries=1 --timeout=110 --memory=192 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=150
redirect_stderr=true
stdout_logfile=/var/log/supervisor/autofinx-nexus-research.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:autofinx-nexus-training]
directory=/var/www/autofinx/backends
command=/usr/bin/php artisan queue:work nexus --queue=agent_training --sleep=5 --tries=1 --timeout=110 --memory=256 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=150
redirect_stderr=true
stdout_logfile=/var/log/supervisor/autofinx-nexus-training.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
